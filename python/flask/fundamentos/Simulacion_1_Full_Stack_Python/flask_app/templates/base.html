<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BookHub</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

<nav class="navbar navbar-dark bookhub-navbar">

    <div class="container">

        <a class="navbar-brand" href="/libros">
            📖 <span>BookHub</span>
        </a>

        <div class="menu">

            <a href="/libros">
                Mis Libros
            </a>

            <a href="/libros">
                Explorar
            </a>

            <a href="/favoritos">
                Mis Favoritos
            </a>

            <a href="/logout">
                Cerrar sesión
            </a>

        </div>

    </div>

</nav>


<main class="container principal">

    {% with mensajes = get_flashed_messages() %}

        {% for mensaje in mensajes %}

            <div class="alert alert-warning mensaje">
                {{ mensaje }}
            </div>

        {% endfor %}

    {% endwith %}


    {% block contenido %}

    {% endblock %}

</main>

</body>

</html>
