{% extends "base.html" %}

{% block contenido %}

<div class="formulario-contenedor">

    <h1>Agregar Nuevo Libro</h1>

    <p class="texto-formulario">
        Completa la información del libro.
    </p>

    {% with mensajes = get_flashed_messages() %}

        {% for mensaje in mensajes %}

            <div class="alert alert-warning">
                {{ mensaje }}
            </div>

        {% endfor %}

    {% endwith %}


    <form action="/libros/crear" method="POST">

        <div class="campo">

            <label>Título:</label>

            <input
                type="text"
                name="titulo"
                class="form-control"
                minlength="2"
                required
            >

        </div>


        <div class="campo">

            <label>Autor:</label>

            <input
                type="text"
                name="autor"
                class="form-control"
                minlength="2"
                required
            >

        </div>


        <div class="campo">

            <label>Género:</label>

            <select
                name="genero"
                class="form-select"
                required
            >

                <option value="">
                    Selecciona un género
                </option>

                <option value="Novela">
                    Novela
                </option>

                <option value="Fantasía">
                    Fantasía
                </option>

                <option value="Terror">
                    Terror
                </option>

                <option value="Ciencia ficción">
                    Ciencia ficción
                </option>

                <option value="Romance">
                    Romance
                </option>

                <option value="Desarrollo personal">
                    Desarrollo personal
                </option>

            </select>

        </div>


        <div class="campo">

            <label>Fecha de publicación:</label>

            <input
                type="date"
                name="fecha_publicacion"
                class="form-control"
                required
            >

        </div>


        <div class="campo">

            <label>Descripción:</label>

            <textarea
                name="descripcion"
                class="form-control"
                minlength="10"
                required
            ></textarea>

        </div>


        <div class="botones-formulario">

            <button
                type="submit"
                class="btn btn-primary"
            >
                Guardar
            </button>

            <a
                href="/libros"
                class="btn btn-secondary"
            >
                Cancelar
            </a>

        </div>

    </form>

</div>

{% endblock %}
