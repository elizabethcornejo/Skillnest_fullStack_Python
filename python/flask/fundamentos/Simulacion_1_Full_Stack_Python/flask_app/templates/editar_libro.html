{% extends "base.html" %}

{% block title %}BookHub - Editar Libro{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <h1 class="mb-4">
                        Editar Libro
                    </h1>


                    <form action="{{ url_for('libros.editar', libro_id=libro.id) }}"
                          method="POST">


                        <div class="mb-3">

                            <label class="form-label">
                                Título
                            </label>

                            <input type="text"
                                   name="titulo"
                                   class="form-control"
                                   value="{{ libro.titulo }}"
                                   required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Autor
                            </label>

                            <input type="text"
                                   name="autor"
                                   class="form-control"
                                   value="{{ libro.autor }}"
                                   required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Género
                            </label>

                            <select name="genero"
                                    class="form-select"
                                    required>

                                <option value="Novela"
                                    {% if libro.genero == "Novela" %}selected{% endif %}>
                                    Novela
                                </option>

                                <option value="Fantasía"
                                    {% if libro.genero == "Fantasía" %}selected{% endif %}>
                                    Fantasía
                                </option>

                                <option value="Ciencia Ficción"
                                    {% if libro.genero == "Ciencia Ficción" %}selected{% endif %}>
                                    Ciencia Ficción
                                </option>

                                <option value="Romance"
                                    {% if libro.genero == "Romance" %}selected{% endif %}>
                                    Romance
                                </option>

                                <option value="Misterio"
                                    {% if libro.genero == "Misterio" %}selected{% endif %}>
                                    Misterio
                                </option>

                                <option value="Terror"
                                    {% if libro.genero == "Terror" %}selected{% endif %}>
                                    Terror
                                </option>

                                <option value="Historia"
                                    {% if libro.genero == "Historia" %}selected{% endif %}>
                                    Historia
                                </option>

                                <option value="Desarrollo Personal"
                                    {% if libro.genero == "Desarrollo Personal" %}selected{% endif %}>
                                    Desarrollo Personal
                                </option>

                            </select>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Fecha de publicación
                            </label>

                            <input type="date"
                                   name="fecha_publicacion"
                                   class="form-control"
                                   value="{{ libro.fecha_publicacion }}"
                                   required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Descripción
                            </label>

                            <textarea name="descripcion"
                                      class="form-control"
                                      rows="5"
                                      required>{{ libro.descripcion }}</textarea>

                        </div>


                        <div class="d-flex gap-2">

                            <button type="submit"
                                    class="btn btn-dark">

                                Actualizar

                            </button>

                            <a href="{{ url_for('libros.detalle', libro_id=libro.id) }}"
                               class="btn btn-secondary">

                                Cancelar

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
