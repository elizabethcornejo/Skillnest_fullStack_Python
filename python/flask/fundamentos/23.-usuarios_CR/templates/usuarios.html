<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Usuarios</title>
</head>
<body>
    <h1>Usuarios</h1>
    <a href="/usuarios/nuevo">Nuevo Usuario</a>

    <table border="1">
        <thead>
            <tr>
                <th>Id</th>
                <th>Nombre Completo</th>
                <th>E-mail</th>
                <th>Fecha Creación</th>
            </tr>
        </thead>
        <tbody>
            {% for u in usuarios %}
            <tr>
                <td>{{ u.id }}</td>
                <td>{{ u.nombre }} {{ u.apellido }}</td>
                <td>{{ u.email }}</td>
                <td>{{ u.created_at.strftime('%Y-%m-%d') if u.created_at else '' }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
