<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Todos los Usuarios</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="header">
        <h1>Usuarios</h1>
        <a href="{{ url_for('nuevo_usuario') }}">Nuevo Usuario</a>
    </div>

    <table border="1" cellpadding="5" cellspacing="0">
        <thead>
            <tr>
                <th>Id</th>
                <th>Nombre Complet</th>
                <th>E-mail</th>
                <th>Fecha Creació</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for usuario in usuarios %}
            <tr>
                <td>{{ usuario.id }}</td>
                <td>{{ usuario.nombre }} {{ usuario.apellido }}</td>
                <td>{{ usuario.email }}</td>
                <td>
                    {% if usuario.created_at %}
                        {{ usuario.created_at.strftime("%Y-%m-%d") }}
                    {% endif %}
                </td>
                <td>
                    <a href="{{ url_for('ver_usuario', id=usuario.id) }}">Ver</a>
                    <a href="{{ url_for('editar_usuario', id=usuario.id) }}">Editar</a>
                    <a href="{{ url_for('borrar_usuario', id=usuario.id) }}">Borra</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
