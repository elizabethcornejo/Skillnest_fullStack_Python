<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskTrack - Iniciar sesión</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

<div class="container">

    <div class="row justify-content-center align-items-center min-vh-100">

        <div class="col-md-5">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h1 class="text-center mb-2">
                        TaskTrack
                    </h1>

                    <p class="text-center text-muted mb-4">
                        Inicia sesión para continuar
                    </p>

                    {% with mensajes = get_flashed_messages(with_categories=true) %}

                        {% if mensajes %}

                            {% for categoria, mensaje in mensajes %}

                                <div class="alert alert-{{ categoria }}">
                                    {{ mensaje }}
                                </div>

                            {% endfor %}

                        {% endif %}

                    {% endwith %}

                    <form
                        action="{{ url_for('iniciar_sesion') }}"
                        method="POST"
                    >

                        <div class="mb-3">

                            <label
                                for="email"
                                class="form-label"
                            >
                                Correo
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                class="form-control"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label
                                for="password"
                                class="form-label"
                            >
                                Contraseña
                            </label>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="form-control"
                                required
                            >

                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Iniciar sesión
                        </button>

                    </form>

                    <hr>

                    <p class="text-center mb-0">
                        ¿No tienes una cuenta?
                    </p>

                    <a
                        href="{{ url_for('registro') }}"
                        class="btn btn-outline-secondary w-100 mt-2"
                    >
                        Crear cuenta
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
