{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">

    <h1>
        Categorías
    </h1>

    <a
        href="/categorias/nueva"
        class="btn btn-primary"
    >
        + Nueva Categoría
    </a>

</div>


<table class="table table-bordered">

<thead class="table-light">

<tr>

    <th>
        Nombre
    </th>

    <th>
        Cantidad de tareas
    </th>

    <th>
        Acciones
    </th>

</tr>

</thead>


<tbody>

{% for categoria in categorias %}

<tr>

    <td>
        {{ categoria.nombre }}
    </td>

    <td>
        {{ categoria.cantidad_tareas }}
    </td>

    <td>

        <a href="/categorias/{{ categoria.id }}">
            Ver
        </a>

        <a href="/categorias/editar/{{ categoria.id }}">
            Editar
        </a>


        <form
            action="/categorias/eliminar/{{ categoria.id }}"
            method="POST"
            class="d-inline"
            onsubmit="return confirm('¿Eliminar categoría?')"
        >

            <button class="btn-link text-danger">
                Borrar
            </button>

        </form>

    </td>

</tr>

{% else %}

<tr>

    <td colspan="3">
        No hay categorías.
    </td>

</tr>

{% endfor %}

</tbody>

</table>

{% endblock %}
