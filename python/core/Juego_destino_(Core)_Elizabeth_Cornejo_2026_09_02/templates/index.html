<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Juego del Destino - Inicio</title>
    <!-- Incluir Font Awesome para los íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="main-container">
        <!-- Cabecera Oscura -->
        <div class="header-dark">
            <span class="header-icon"><i class="fas fa-moon"></i></span>
            <h1>El Juego del Destino</h1>
            <p>Descubre qué te depara el futuro</p>
        </div>

        <!-- Contenido Blanco con Formulario -->
        <div class="content-white">
            <form action="{{ url_for('enviar') }}" method="POST">
                
                <!-- Campo Nombre -->
                <div class="form-group">
                    <span class="input-icon"><i class="fas fa-user"></i></span>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
                </div>

                <!-- Campo Edad -->
                <div class="form-group">
                    <span class="input-icon"><i class="fas fa-calendar-alt"></i></span>
                    <input type="number" id="edad" name="edad" placeholder="Tu edad" required>
                </div>

                <!-- Campo Color Favorito -->
                <div class="form-group">
                    <span class="input-icon"><i class="fas fa-palette"></i></span>
                    <input type="text" id="color" name="color" placeholder="Tu color favorito" required>
                    <p class="form-help">Ej. rojo, azul, verde, morado...</p>
                </div>

                <!-- Campo Animal Favorito -->
                <div class="form-group">
                    <span class="input-icon"><i class="fas fa-paw"></i></span>
                    <input type="text" id="animal" name="animal" placeholder="Tu animal favorito" required>
                    <p class="form-help">Ej. perro, gato, águila, león...</p>
                </div>

                <!-- Esfera de Cristal Decorativa -->
                <div class="crystal-ball-container">
                    <div class="crystal-ball"></div>
                </div>

                <!-- Botón de Envío -->
                <button type="submit" class="btn-reveal">
                    <i class="fas fa-magic"></i> Revelar mi destino
                </button>
            </form>
        </div>
    </div>
</body>
</html>
