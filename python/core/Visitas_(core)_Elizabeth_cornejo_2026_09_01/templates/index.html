<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Visitas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f9;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { color: #333; }
        .contador {
            font-size: 2.5rem;
            color: #007bff;
            margin: 10px 0;
        }
        .btn {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            font-weight: bold;
        }
        .btn-primary { background-color: #007bff; }
        .btn-warning { background-color: #ffc107; color: #333; }
        .btn-danger { background-color: #dc3545; }
        form { margin: 15px 0; }
        input[type="number"] {
            padding: 8px;
            width: 80px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Contador de Visitas</h1>
        
        <p>Has visitado esta página:</p>
        <div class="contador">{{ visitas }} veces</div>

        <!-- BONUS ORO: Cantidad de veces que se ha reiniciado -->
        <p><strong>Contador de reinicios:</strong> {{ reinicios }}</p>

        <hr>

        <!-- BONUS PLATA: Botón +2 -->
        <form action="/aumentar_dos" method="POST" style="display: inline-block;">
            <button type="submit" class="btn btn-primary">+2 Visitas</button>
        </form>

        <!-- BONUS PLATA: Botón Reiniciar visitas -->
        <form action="/reiniciar" method="POST" style="display: inline-block;">
            <button type="submit" class="btn btn-warning">Reiniciar Visitas</button>
        </form>

        <!-- BONUS ORO: Formulario para incremento personalizado -->
        <form action="/incrementar_personalizado" method="POST">
            <label for="cantidad">Aumentar por número:</label>
            <input type="number" id="cantidad" name="cantidad" min="1" required>
            <button type="submit" class="btn btn-primary">Sumar</button>
        </form>

        <hr>

        <!-- NIVEL 1: Enlace para destruir la sesión completa -->
        <p>
            <a href="/destruir_sesion">
                <button class="btn btn-danger">Destruir Sesión Completa</button>
            </a>
        </p>
    </div>
</body>
</html>
